# The dskharness bundle patch: terminal client over dsh-base.
# Mounts no Host, HTTP server, or browser plugin — the cli-startup plugin
# injects cmdlineArgs, creates an in-process agent, bridges questions to the
# TUI modal, and drives headless or interactive runs.
#   dsh --profile cli "task"      one-shot headless run
#   dsh --profile cli             interactive TUI

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off for the terminal client.
- id: hmr
  disabled: true

- insert:
    - id: cli-startup
      name: 'dskharness/startup'
