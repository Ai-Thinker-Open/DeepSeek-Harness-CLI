# The @ai-thinker/deepseek-harness-cli bundle patch: the terminal surface over dsh-base.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# The tui-startup plugin injects `cmdlineArgs` and provides `tuiStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# the Loader resolves their expressions only after it exists. The tui-runner
# row then reads the resolved startup values and spawns the OpenTUI client
# against the bound API/WS transport.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live while the terminal runs.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other surfaces.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── terminal-only host rows: the API/WS transport and the runner ────────────
#
# The `name` entries below reference THIS package's own name (it exports
# `./startup` and its main entry). If you ever rename the package in
# package.json, update the two `@ai-thinker/deepseek-harness-cli` names here to match.
- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Storage backends the workspace row consumes (composed the same way the
    # web surface composes them).
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # Host services the API gateway injects (the web surface composes them too).
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    - id: tui-startup
      name: '@ai-thinker/deepseek-harness-cli/startup'

    # The API gateway: the transport-agnostic dispatch face every client shape
    # shares (the same gateway the web surface proxies).
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [tuiStartup]
      config:
        host: !!js ctx.tuiStartup.host ?? '127.0.0.1'
        port: !!js ctx.tuiStartup.port ?? 3080

    # Host-side /api binding: HTTP bridge + WebSocket downlink (events.mux).
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    # The terminal runner: spawns the OpenTUI client once the server binds and
    # requests dsh shutdown when the client exits.
    - id: tui-runner
      name: '@ai-thinker/deepseek-harness-cli'
      inject: [tuiStartup, webServer]
      config:
        startup: !!js ctx.tuiStartup
